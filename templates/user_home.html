{% extends "layout.html" %}

{% block main %}

<div class = "justify-content-center centered align-items-center jumbotron">
    <h1>Welcome {{ name }} </h1>
</div>

<div class="d-flex gap-1 flex-md-row col-8 justify-content-center align-items-center container" style="padding-top: 3%;">
    <div class = "col d-flex justify-content-center">
        <a class= "card col-8 rounded-4 align-items-center link-card" href="/start_quiz" style="text-decoration: none;">
        <div class="card-body d-flex flex-column align-items-center justify-content-center">
            <img src = "static/images/quiz.png" class = "link-button-icon">
            <h1>Start quiz</h1>
        </div>
    </a>
    </div>
    <div class = "col d-flex justify-content-center">
        <a class="card col-8 rounded-4 align-items-center link-card" href="/progress" style="text-decoration: none;">
        <div class="card-body d-flex flex-column align-items-center justify-content-center">
            <img src = "static/images/success.png" class= "link-button-icon">
            <h1>Track progress</h1>
        </div>
    </a>
    </div>
</div>

<img src = "/static/images/mao_sleeping.png" class = "bottom-corner">

{% endblock %}
