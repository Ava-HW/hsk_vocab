{% extends "layout.html" %}

{% block main %}

<div class = "justify-content-center centered align-items-center vertically-centered">
  <div class = "card login-card">
    <img src="/static/images/welcome.png" class="login-card-img">
    <div class="card-body">
      <div>
         <h1>Register now</h1>
        <form action = "/sign_up" method = "POST" class = "form-group login-form" autocomplete="off">
          <div class="justify-content-center form-field">
            <label for="exampleInputEmail1">Email address</label>
            <input name = "email" type="email" class="form-control" aria-describedby="emailHelp" placeholder="Enter email" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" maxlength="200">
          </div>
          <div class = "form-field">
            <label for="exampleInputPassword1">Password</label>
            <input name = "password" type="password" class="form-control" placeholder="Password" maxlength="200">
          </div>
          <div class = "form-field">
            <label for="exampleInputPassword1">Name</label>
            <input name = "name" type="text" class="form-control" placeholder="Name" maxlength="200">
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
             <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message | safe }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
