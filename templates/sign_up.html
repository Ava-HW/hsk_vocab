{% extends "layout.html" %}

{% block main %}

<div class = "justify-content-center centered align-items-center vertically-centered">
  <div class = "card login-card">
    <img src="/static/images/welcome.png" class="login-card-img">
    <div class="card-body">
      <div>
         <h1>Register now</h1>
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for catergory, message in messages %}
             <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form action = "/sign_up" method = "POST" class = "form-group login-form">
          <div class="justify-content-center form-field">
            <label for="exampleInputEmail1">Email address</label>
            <input name = "email" type="email" class="form-control" aria-describedby="emailHelp" placeholder="Enter email">
          </div>
          <div class = "form-field">
            <label for="exampleInputPassword1">Password</label>
            <input name = "password" type="password" class="form-control" placeholder="Password">
          </div>
          <div class = "form-field">
            <label for="exampleInputPassword1">Name</label>
            <input name = "name" type="text" class="form-control" placeholder="Name">
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
    document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', function() { 
            // update text displayed on button
            const dropdown = this.closest('.dropdown');
            const button = dropdown.querySelector('.dropdown-toggle');
            button.textContent = this.textContent;
            // update hidden input field
            const hiddenInput = dropdown.querySelector('input[type="hidden"]');
            if (hiddenInput) {
                hiddenInput.value = this.textContent.trim().toLowerCase().replaceAll(" ", "_");
            }
        });
    });
</script>

{% endblock %}
